# XcodeGen project spec for KeyNest (iOS port of the Android app KeyNest).
#
# Build on a Mac:
#   brew install xcodegen
#   xcodegen generate
#   open KeyNest.xcodeproj
#
# Identifiers (set):
#   - PRODUCT_BUNDLE prefix : io.github.hitoshiichikawa.ios.keynest
#   - App Group             : group.io.github.hitoshiichikawa.ios.keynest
#   - Keychain group        : $(AppIdentifierPrefix)io.github.hitoshiichikawa.ios.keynest.shared
# Still required before device builds:
#   - DEVELOPMENT_TEAM      : your Apple Team ID (set locally / via xcconfig, kept out of VCS)

name: KeyNest

# Per-developer build settings (DEVELOPMENT_TEAM). The file is git-ignored;
# Local.xcconfig.example shows the shape. Generation fails fast if the file is
# absent, which is intentional: device builds require a Team ID.
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

options:
  bundleIdPrefix: io.github.hitoshiichikawa.ios.keynest
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en

# Both EN (source) and JA strings live in KeyNest/Resources/Localizable.xcstrings.
knownRegions:
  - en
  - ja

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: ABCDE12345   # ← set locally / via xcconfig, do NOT commit a real value
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # 1 = iPhone, 2 = iPad — both targets are universal so the extension
    # is reachable from iPad's AutoFill UI as well.
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: 6.29.0

targets:

  # ---- Shared logic framework (domain / data / crypto / webauthn / autofill) ----
  KeyNestKit:
    type: framework
    platform: iOS
    sources:
      - path: KeyNestKit
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hitoshiichikawa.ios.keynest.kit
        APPLICATION_EXTENSION_API_ONLY: YES   # framework is linked into an app extension
        DEFINES_MODULE: YES
        GENERATE_INFOPLIST_FILE: YES

  # ---- Main app ----
  KeyNest:
    type: application
    platform: iOS
    sources:
      - path: KeyNest
      # PrivacyInfo.xcprivacy is required by App Store Review (2024-05+).
      # XcodeGen doesn't recognize the extension by default, so wire it
      # in as a resource explicitly.
      - path: KeyNest/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: KeyNestKit
        embed: true
      - target: AutoFillExtension   # embeds the .appex into the app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hitoshiichikawa.ios.keynest
        INFOPLIST_FILE: KeyNest/Info.plist
        CODE_SIGN_ENTITLEMENTS: KeyNest/KeyNest.entitlements
        ENABLE_PREVIEWS: YES

  # ---- AutoFill Credential Provider extension (passwords + passkeys) ----
  AutoFillExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: AutoFillExtension
      # Share the host app's string catalog so SwiftUI Text(...) inside the
      # extension localizes the same way (extension bundle is separate).
      - path: KeyNest/Resources/Localizable.xcstrings
        buildPhase: resources
      - path: AutoFillExtension/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: KeyNestKit
        embed: false   # the host app embeds KeyNestKit; extension links it
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hitoshiichikawa.ios.keynest.autofill
        INFOPLIST_FILE: AutoFillExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: AutoFillExtension/AutoFillExtension.entitlements

  # ---- Unit tests (run on Mac/simulator) ----
  KeyNestKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KeyNestKitTests
    dependencies:
      - target: KeyNestKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.hitoshiichikawa.ios.keynest.kit.tests

schemes:
  KeyNest:
    build:
      targets:
        KeyNest: all
        AutoFillExtension: all
    run:
      config: Debug
    test:
      targets:
        - KeyNestKitTests
